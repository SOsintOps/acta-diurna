name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Una build fatta senza .env non deve contenere chiavi: se ne compare
      # una, qualcosa le ha compilate nel bundle.
      - name: Nessuna chiave API nel bundle
        run: |
          if grep -rEq 'sk-ant-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}' dist/; then
            echo "Trovata una chiave API in dist/"; exit 1
          fi
